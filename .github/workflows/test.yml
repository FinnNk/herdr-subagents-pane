name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # opencode embeds Bun; the tests use only bun:test and node: modules.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test
